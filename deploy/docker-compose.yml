# На сервере: положите .env рядом, укажите домен в Caddyfile, затем
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment:
      DATA_DIR: /var/lib/autoinvest
      # APP_ENV берётся из .env (по умолчанию в образе — production)
    volumes:
      - data:/var/lib/autoinvest
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  data:
  caddy_data:
